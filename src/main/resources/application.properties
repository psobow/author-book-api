#configure console output:
spring.application.name=demo
spring.main.banner-mode=off
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=\
  %clr(%d{yy-MM-dd HH:mm:ss.SSS}){faint} \
  %clr(%-5level) \
  %clr(${PID}){magenta} \
  %clr(-){faint} \
  %clr([${spring.application.name}]){faint} \
  %clr({%thread}){faint} \
  %clr(%-40.40logger{39}){cyan} \
  %clr(:){faint} \
  %clr(%message%n%exception{short})

#configure console log depth visibility
#logging.level.com.sobow.demo=DEBUG